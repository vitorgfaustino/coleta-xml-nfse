name: CI

on:
  push:
    branches:
      - develop
      - main
      - beta
      - "agents/**"
      - "feature/**"
  pull_request:
    branches:
      - develop
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Compilar Python
        run: python -m compileall -q nfse nfse_app.py scripts build.py
      - name: Sintaxe do JavaScript
        run: node --check web/app.js
      - name: Gerar leitor estático
        run: python scripts/build_pages.py
      - name: Conferir leitor gerado
        run: test -f pages/index.html
